name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Публикуем в ветку gh-pages, поэтому нужен только доступ на запись в репозиторий.
# Права выдаются точечно на уровне job'ов, а не всему workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci ставит ровно то, что записано в package-lock.json, и падает при рассинхроне.
      # Сторонний bahmutov/npm-install не нужен: кэш npm уже даёт setup-node.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Хэш и дата сборки попадают в /info.json и показываются в футере сайта.
      - name: Create build info JSON file
        run: |
          printf '{\n  "buildDate": "%s",\n  "buildVersion": "%s"\n}\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "${GITHUB_SHA:0:7}" > public/info.json

      - name: Build project
        run: npm run build

      - name: Upload production-ready build files
        uses: actions/upload-artifact@v4
        with:
          name: production-files
          path: ./dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: production-files
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Один осиротевший коммит вместо истории артефактов — репозиторий не пухнет.
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'
          user_name: 'github-actions[bot]'
          user_email: '41898282+github-actions[bot]@users.noreply.github.com'
